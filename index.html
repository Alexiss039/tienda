<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Clock Lens | Catálogo de relojes y gafas</title>
  <meta name="description" content="Tienda de relojes y gafas en Medellín. Explora nuestro catálogo y paga de forma segura.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado" id="encabezado"></header>

  <main class="principal">
    <div class="contenedor">

      <section class="seccion hero" aria-labelledby="titulo-hero">
        <div class="hero__texto">
          <h1 id="titulo-hero">Marca el tiempo. Define tu estilo.</h1>
          <p>
            Relojes y gafas que elevan tu presencia y hablan por ti. Diseños
            exclusivos, elegancia sin límites y actitud en cada detalle.
          </p>
          <p><strong>Pago seguro con Wompi</strong> · Envío fijo de $10.000</p>
          <a class="boton boton--primario" href="#catalogo">Ver productos</a>
        </div>
        <div class="hero__media">
          <img src="img/hero.svg" alt="Reloj y gafas destacados">
        </div>
      </section>

      <section class="seccion" id="catalogo" aria-labelledby="titulo-catalogo">
        <h2 class="seccion__titulo" id="titulo-catalogo">Nuestros productos</h2>
        <p class="seccion__descripcion" id="conteo"></p>
        <div id="avisos"></div>
        <div class="rejilla-productos" id="rejilla"></div>
      </section>

    </div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="js/cargar.js"></script>
  <script src="js/paginas/catalogo.js"></script>
</body>
</html>
