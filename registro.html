<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Clock Lens | Crear cuenta</title>
  <meta name="description" content="Regístrate en O'Clock Lens y compra relojes y gafas en línea.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado" id="encabezado"></header>

  <main class="principal">
    <div class="contenedor">
      <section class="seccion" aria-labelledby="titulo-registro">
        <h1 class="seccion__titulo" id="titulo-registro">Crear cuenta</h1>
        <p class="seccion__descripcion">Completa el formulario para registrarte. Solo te tomará un minuto.</p>
        <div id="avisos"></div>

        <form class="tarjeta-formulario formulario-ancho" id="form-registro">
          <div class="rejilla-campos">
            <div class="campo"><label for="nombre">Nombre</label><input type="text" id="nombre" required></div>
            <div class="campo"><label for="apellidos">Apellidos</label><input type="text" id="apellidos" required></div>
            <div class="campo"><label for="correo">Correo electrónico</label><input type="email" id="correo" required></div>
            <div class="campo"><label for="celular">Celular</label><input type="tel" id="celular" required></div>
            <div class="campo"><label for="direccion">Dirección</label><input type="text" id="direccion" required></div>
            <div class="campo"><label for="ciudad">Ciudad</label><input type="text" id="ciudad" required></div>
            <div class="campo"><label for="barrio">Barrio</label><input type="text" id="barrio" required></div>
            <div></div>
            <div class="campo"><label for="clave">Contraseña</label><input type="password" id="clave" required></div>
            <div class="campo"><label for="clave2">Repetir contraseña</label><input type="password" id="clave2" required></div>
          </div>
          <button type="submit" class="boton boton--primario boton--bloque">Registrarme</button>
          <p class="formulario__pie">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="js/cargar.js"></script>
  <script src="js/paginas/registro.js"></script>
</body>
</html>
