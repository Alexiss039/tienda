<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Clock Lens | Admin: pedidos</title>
  <meta name="description" content="Listado de pedidos y actualización de envío.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado" id="encabezado"></header>

  <main class="principal">
    <div class="contenedor">
      <section class="seccion" aria-labelledby="titulo-admin">
        <h1 class="seccion__titulo" id="titulo-admin">Pedidos recibidos</h1>
        <p class="seccion__descripcion">Consulta las ventas y registra el despacho de cada pedido.</p>
        <div id="avisos"></div>
        <div class="contenedor-tabla"><table class="tabla" id="tabla-pedidos"></table></div>
      </section>

      <section class="seccion" aria-labelledby="titulo-bitacora">
        <h2 id="titulo-bitacora">Bitácora de pagos y correos</h2>
        <div class="contenedor-tabla"><table class="tabla" id="tabla-bitacora"></table></div>
      </section>
    </div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="js/cargar.js"></script>
  <script src="js/paginas/admin-pedidos.js"></script>
</body>
</html>
