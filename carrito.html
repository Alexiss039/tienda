<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Clock Lens | Carrito de compra</title>
  <meta name="description" content="Revisa los productos de tu carrito y procede al pago en O'Clock Lens.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado" id="encabezado"></header>

  <main class="principal">
    <div class="contenedor">
      <section class="seccion" aria-labelledby="titulo-carrito">
        <h1 class="seccion__titulo" id="titulo-carrito">Tu carrito</h1>
        <p class="seccion__descripcion" id="conteo"></p>
        <div id="avisos"></div>
        <div class="carrito" id="carrito"></div>
      </section>
    </div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="js/cargar.js"></script>
  <script src="js/paginas/carrito.js"></script>
</body>
</html>
