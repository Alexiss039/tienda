<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Clock Lens | Iniciar sesión</title>
  <meta name="description" content="Inicia sesión en O'Clock Lens para comprar relojes y gafas.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado" id="encabezado"></header>

  <main class="principal">
    <div class="contenedor">
      <section class="seccion" aria-labelledby="titulo-login">
        <h1 class="seccion__titulo" id="titulo-login">Iniciar sesión</h1>
        <p class="seccion__descripcion">Ingresa con tu correo y contraseña.</p>
        <div id="avisos"></div>
        <form class="tarjeta-formulario" id="form-login">
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" placeholder="Tu contraseña" required>
          </div>
          <button type="submit" class="boton boton--primario boton--bloque">Entrar</button>
          <p class="formulario__pie">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
        </form>
      </section>
    </div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="js/cargar.js"></script>
  <script src="js/paginas/login.js"></script>
</body>
</html>
