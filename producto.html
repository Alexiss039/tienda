<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'Clock Lens | Detalle de producto</title>
  <meta name="description" content="Detalle del producto: características, comentarios y precio.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado" id="encabezado"></header>

  <main class="principal">
    <div class="contenedor">

      <nav class="seccion" aria-label="Ruta de navegación">
        <p><a href="index.html">Catálogo</a> &rsaquo; <span id="ruta-nombre"></span></p>
      </nav>
      <div id="avisos"></div>

      <section class="seccion detalle" aria-labelledby="titulo-producto">

        <div class="detalle__imagen">
          <img id="detalle-imagen" src="img/logo.svg" alt="">
        </div>

        <div class="detalle__info">
          <span class="tarjeta__categoria" id="detalle-categoria"></span>
          <h1 id="titulo-producto"></h1>
          <p class="detalle__precio" id="detalle-precio"></p>
          <p id="detalle-descripcion"></p>

          <h2>Características</h2>
          <ul class="detalle__ficha" id="detalle-ficha"></ul>

          <div class="cantidad">
            <label for="cantidad">Cantidad</label>
            <div class="cantidad__control">
              <button type="button" class="cantidad__boton" id="cantidad-menos" aria-label="Disminuir cantidad" disabled>&minus;</button>
              <input type="number" id="cantidad" name="cantidad" value="1" min="1" readonly>
              <button type="button" class="cantidad__boton" id="cantidad-mas" aria-label="Aumentar cantidad">+</button>
            </div>
          </div>

          <div class="detalle__acciones">
            <button type="button" class="boton boton--primario" id="agregar">Añadir al carrito</button>
            <a class="boton boton--borde" href="index.html">Seguir viendo productos</a>
          </div>
        </div>

      </section>

      <section class="seccion" aria-labelledby="titulo-comentarios">
        <h2 id="titulo-comentarios">Comentarios</h2>
        <div id="comentarios"></div>
        <form id="form-comentario" class="formulario-ancho" hidden>
          <div class="campo">
            <label for="texto-comentario">Tu comentario</label>
            <textarea id="texto-comentario" rows="3" required></textarea>
          </div>
          <button type="submit" class="boton boton--secundario">Publicar comentario</button>
        </form>
        <p id="aviso-comentario" class="pista"></p>
      </section>

    </div>
  </main>

  <footer class="pie" id="pie"></footer>

  <script src="js/cargar.js"></script>
  <script src="js/cantidad.js"></script>
  <script src="js/paginas/detalle.js"></script>
</body>
</html>
